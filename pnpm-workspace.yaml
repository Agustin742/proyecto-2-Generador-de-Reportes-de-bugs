allowBuilds:
  msw: true
minimumReleaseAge: 10080
# Excepciones puntuales: entradas preexistentes del lockfile que bloqueaban la
# instalacion de las fuentes Polilla (RFC-0001). Mantienen la politica intacta
# para el resto de dependencias.
minimumReleaseAgeExclude:
  - '@ungap/structured-clone@1.3.2'
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@6.3.1'
